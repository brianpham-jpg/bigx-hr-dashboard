<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>BigX HR Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="main.css">
</head>
<body>


<div id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">
      <div class="logo-box"><i class="ti ti-building"></i></div>
      <div>
        <div class="logo-name">BigX Agency</div>
        <div class="logo-sub">HR Dashboard</div>
      </div>
    </div>
    <span class="live-badge"><span class="live-dot"></span>Live Data</span>
  </div>

  <nav>
    <div class="nav-item active" id="nav-ov" onclick="nav('overview')"><i class="ti ti-layout-dashboard"></i>Tổng quan</div>
    <div class="nav-item" id="nav-hs" onclick="nav('ho-so')"><i class="ti ti-id-badge"></i>Hồ sơ nhân sự</div>
    <div class="nav-item" onclick="nav('so-do')"><i class="ti ti-sitemap"></i>Sơ đồ & quy trình</div>
    <div class="nav-sub" id="nav-so-do" onclick="nav('so-do')"><i class="ti ti-chart-dots"></i>Sơ đồ tổ chức</div>
    <div class="nav-sub" id="nav-qd" onclick="nav('quy-dinh')"><i class="ti ti-book"></i>Quy định</div>
    <div class="nav-sub" id="nav-qt" onclick="nav('quy-trinh')"><i class="ti ti-arrow-guide"></i>Quy trình</div>
    <div class="nav-item" id="nav-td" onclick="nav('tuyen-dung')"><i class="ti ti-file-description"></i>Tuyển dụng</div>
    <div class="nav-sub" id="nav-khocv" onclick="nav('kho-cv')"><i class="ti ti-folder"></i>Kho CV</div>
    <div class="nav-item" onclick="nav('coming')"><i class="ti ti-file-certificate"></i>Hợp đồng nhân sự</div>
    <div class="nav-sub" onclick="nav('form-hd')"><i class="ti ti-template"></i>Form mẫu HĐ BigX</div>
    <div class="nav-item" id="nav-cv" onclick="nav('cong-viec')"><i class="ti ti-checklist"></i>Công việc nhân sự</div>
    <div class="nav-item" onclick="nav('coming')"><i class="ti ti-mail"></i>Mail</div>
    <div class="nav-item" id="nav-cal" onclick="nav('calendar')"><i class="ti ti-calendar"></i>Calendar</div>
  </nav>

  <div class="sb-footer">
    <div class="avatar">BP</div>
    <div>
      <div style="font-size:11px;font-weight:500;color:#fff;">Brian Pham</div>
      <div style="font-size:10px;color:#c4b5fd;">HR Specialist</div>
    </div>
  </div>
</div>

<div id="main">
  <div class="topbar">
    <div class="topbar-left" id="topbar-left">
      <i class="ti ti-file-description"></i>
      Tuyển dụng
      <span class="live-tag">● Live</span>
    </div>
    <div class="topbar-right">
      <span class="update-time" id="uptime">--</span>
      <button class="btn-refresh" onclick="loadData()"><i class="ti ti-refresh"></i>Làm mới</button>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="fb" onclick="setFilter('week')">Tuần này</button>
    <button class="fb" onclick="setFilter('last-week')">Tuần trước</button>
    <button class="fb active" onclick="setFilter('month')">Tháng này</button>
    <button class="fb" onclick="setFilter('last-month')">Tháng trước</button>
    <button class="fb" onclick="setFilter('year')">Năm nay</button>
    <button class="fb" onclick="setFilter('all')">Tất cả</button>
    <span class="fb-sep">|</span>
    <input type="date" id="df" class="fb-date">
    <span style="font-size:11px;color:#94a3b8;">→</span>
    <input type="date" id="dt" class="fb-date">
    <button class="fb" onclick="applyRange()">Áp dụng</button>
  </div>

  <div class="content" id="content">
    <div class="loading"><i class="ti ti-loader"></i>Đang tải dữ liệu...</div>
  </div>
</div>


<script src="core.js"></script>
<script src="overview.js"></script>
<script src="data.js?v=2"></script>
<script src="hoso.js"></script>
<script src="congviec.js"></script>
<script src="sodo.js"></script>
<script src="quytrinh.js"></script>
<script src="quydinh.js"></script>
<script src="calendar.js"></script>
<script src="khocv.js"></script>
<script src="init.js"></script>
<script>
/* Prefetch ảnh nhân sự ở nền sau khi trang chính đã hiện — không chặn load đầu.
   Nếu người dùng bấm vào Hồ sơ trước khi ảnh tải xong, photos.js sẽ tự vẽ lại. */
(function(){
  var loaded=false;
  function loadPhotos(){ if(loaded)return; loaded=true; var s=document.createElement('script'); s.src='photos.js?v=2'; s.async=true; document.body.appendChild(s); }
  if('requestIdleCallback' in window){ requestIdleCallback(loadPhotos,{timeout:2500}); }
  else { setTimeout(loadPhotos,1200); }
})();
</script>
</body>
</html>
